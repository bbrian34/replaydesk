[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions.cleanup-videos]
  schedule = "*/10 * * * *"

[functions.refai-analyze]
  max_duration = 30

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[dev]
  command = "echo 'No build step'"
  port = 3000
  targetPort = 3000
